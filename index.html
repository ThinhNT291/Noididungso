<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Speaking Test & Assessment</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Cột Trái -->
        <aside class="sidebar-left" id="sidebar-left">
            <button id="toggle-left" class="toggle-btn"><i class="fas fa-chevron-left"></i></button>
            <div class="sidebar-content">
                <h2>Thiết lập</h2>
                <!-- Các Select (Ngôn ngữ, Cấp độ, Chủ đề) giữ nguyên như cũ -->
                <div class="setting-group"><label>Ngôn ngữ:</label><select id="language-select"><option value="english">Tiếng Anh</option></select></div>
                <div class="setting-group"><label>Cấp độ:</label><select id="level-select"><option value="intermediate">Intermediate</option></select></div>
                <div class="setting-group"><label>Chủ đề:</label><select id="topic-select"><option value="daily">Giao tiếp</option></select></div>
                <button id="btn-start-session" class="btn primary-btn">Bắt đầu mới</button>
            </div>
        </aside>

        <!-- Cột Giữa -->
        <main class="main-content">
            <div class="prompt-section">
                <h3>Câu hỏi / Chủ đề:</h3>
                <p id="current-prompt">Vui lòng bấm "Bắt đầu mới".</p>
            </div>
            <div class="controls-section">
                <button id="btn-record" class="btn record-btn"><i class="fas fa-microphone"></i> Ghi âm</button>
                <button id="btn-stop" class="btn stop-btn" disabled><i class="fas fa-stop"></i> Dừng</button>
                <audio id="audio-playback" controls class="hidden"></audio>
            </div>
            <div class="transcript-section">
                <h3>Transcript</h3>
                <div id="transcript-box" class="content-box"><span class="placeholder-text">...</span></div>
            </div>
            <div class="assessment-section">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>Đánh giá AI</h3>
                    <!-- Nút Lưu bài (mặc định ẩn) -->
                    <button id="btn-save" class="btn btn-save hidden"><i class="fas fa-save"></i> Lưu bài</button>
                </div>
                <div id="assessment-box" class="content-box"><span class="placeholder-text">...</span></div>
            </div>
        </main>

        <!-- Cột Phải -->
        <aside class="sidebar-right" id="sidebar-right">
            <button id="toggle-right" class="toggle-btn"><i class="fas fa-chevron-right"></i></button>
            <div class="sidebar-content">
                <h2>Lịch sử</h2>
                <ul id="history-list"></ul>
            </div>
        </aside>
    </div>
    <script src="app.js"></script>
</body>
</html>
